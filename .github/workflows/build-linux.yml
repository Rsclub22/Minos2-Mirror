name: Build Linux packages

# Builds Minos2 for one tag and publishes the packages as a GitHub release.
# Called by the mirror sync for new release tags, or started by hand.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      targets:
        description: Comma-separated target names, or "all"
        type: string
        default: all
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build (e.g. Mqt_Release_2.8.1.0)
        required: true
        type: string
      targets:
        description: >-
          Targets to build: "all", or a comma-separated subset of
          deb-ubuntu-24.04-amd64, deb-debian-12-arm64, rpm-fedora-41-amd64,
          arch-amd64, appimage-amd64
        type: string
        default: all
      publish:
        description: Publish a GitHub release (off = artifacts only)
        type: boolean
        default: true

concurrency:
  group: build-${{ inputs.tag }}
  # Queue rather than cancel. Runs for one tag may carry different targets -
  # topping a release up with a format built later, or re-running a target that
  # failed - and they all publish into the same release. Cancelling would kill
  # a build that is doing unrelated work, and letting two publish jobs merge
  # the checksum file at once would lose one of their entries.
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # A job-level `if:` cannot see the matrix context, so the target selection
  # has to produce the matrix rather than filter it.
  prepare:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - id: select
        env:
          TARGETS: ${{ inputs.targets }}
          # Set this repository variable to ubuntu-latest if native arm64
          # runners are not available here; the arm64 build then emulates.
          ARM64_RUNNER: ${{ vars.ARM64_RUNNER || 'ubuntu-24.04-arm' }}
        run: ./scripts/select-targets.sh

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    # Generous so an emulated arm64 job still fits; native builds take ~20 min.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out the pipeline
        uses: actions/checkout@v5
        with:
          path: ci

      - name: Check out ${{ inputs.tag }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          path: src

      # Only when the arm64 build landed on an x64 runner. Emulation turns a
      # ~20 minute build into about two hours, so it is the fallback, not the
      # default - see ARM64_RUNNER in scripts/select-targets.sh.
      - name: Enable arm64 emulation
        if: matrix.qemu
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # Hamlib is pinned by mqt/mqthamlib.pri and rarely moves; rebuilding it
      # for every release would dominate the emulated build.
      - name: Restore Hamlib build
        uses: actions/cache@v4
        with:
          path: wd/hamlib-root
          key: hamlib-${{ matrix.name }}-${{ hashFiles('src/mqt/mqthamlib.pri') }}

      - name: Build and package
        run: |
          mkdir -p wd out
          docker run --rm --platform "linux/${{ matrix.arch }}" \
            -v "$PWD/ci:/ci:ro" -v "$PWD/src:/src" \
            -v "$PWD/wd:/wd" -v "$PWD/out:/out" \
            -e SRC=/src -e OUTDIR=/out -e HAMLIB_ROOT=/wd/hamlib-root \
            -e MINOS_REF='${{ inputs.tag }}' \
            -w /wd "${{ matrix.image }}" \
            bash /ci/packaging/run.sh "${{ matrix.format }}"

      - name: Job summary
        run: |
          {
            echo "### ${{ matrix.name }}"
            echo
            echo '```'
            cat wd/minos-build.env
            echo '```'
            echo
            ls -la out
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: minos2-${{ matrix.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

      # Carries the version and build facts to the publish job. Named per
      # target so a run that does not include the reference target still has
      # something to put in the release notes.
      - name: Stash build facts
        run: cp wd/minos-build.env "wd/buildinfo-${{ matrix.name }}.env"

      - uses: actions/upload-artifact@v4
        with:
          name: minos2-buildinfo-${{ matrix.name }}
          path: wd/buildinfo-${{ matrix.name }}.env

  publish:
    name: Publish release
    needs: build
    # always() with an explicit result check: a release with three of five
    # packages is more useful than none, and the missing ones can be re-run
    # into the same release afterwards. But nothing to publish if the build
    # never started.
    if: >-
      always() &&
      (needs.build.result == 'success' || needs.build.result == 'failure') &&
      (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: ci

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: ./ci/scripts/publish-release.sh dist
